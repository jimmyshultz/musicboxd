# Dependabot configuration for Resonare React Native app
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # NPM dependencies for React Native app
  - package-ecosystem: "npm"
    directory: "/Resonare"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "America/Chicago"
    # Limit to 10 PRs at a time to avoid PR overload
    open-pull-requests-limit: 10
    # Group minor and patch updates together to reduce PR noise
    groups:
      # Group all React Native related packages
      react-native:
        patterns:
          - "react-native*"
          - "@react-native*"
        update-types:
          - "minor"
          - "patch"
      # Group React Navigation packages
      navigation:
        patterns:
          - "@react-navigation/*"
        update-types:
          - "minor"
          - "patch"
      # Group Firebase packages
      firebase:
        patterns:
          - "@react-native-firebase/*"
        update-types:
          - "minor"
          - "patch"
      # Group Babel packages
      babel:
        patterns:
          - "@babel/*"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript and type definitions
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Group testing packages
      testing:
        patterns:
          - "jest"
          - "@types/jest"
          - "react-test-renderer"
        update-types:
          - "minor"
          - "patch"
      # Group all other minor/patch updates
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Add labels to PRs for easier filtering
    labels:
      - "dependencies"
      - "npm"
    # Reviewers for dependency PRs (optional - uncomment and add your GitHub username)
    # reviewers:
    #   - "jimmyshultz"
    # Ignore major versions of packages that need manual migration
    ignore:

      # React Native major versions need careful migration
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      # jest 30.4+ calls a jest-mock API (clearMocksOnScope) that jest-mock@29
      # doesn't provide. @react-native/jest-preset (still 0.86) depends on
      # jest-environment-node@^29.7.0, which hoists jest-mock@29.7.0, so all
      # suites fail with "clearMocksOnScope is not a function". Re-verified on
      # RN 0.86 — still broken. Revisit when @react-native/jest-preset moves to
      # the jest 30 environment packages.
      - dependency-name: "jest"
        versions: [">=30.4.0"]
      # eslint 10 is not supported by the plugin set that
      # @react-native/eslint-config@0.86 pins: the config itself declares
      # peer eslint "^8.0.0 || ^9.0.0", and @babel/eslint-parser,
      # eslint-plugin-ft-flow, eslint-plugin-react and
      # eslint-plugin-react-native all cap at eslint 9 even at latest.
      # Revisit when @react-native/eslint-config supports eslint 10.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # Babel 8 can't be adopted piecemeal: @react-native/babel-preset@0.86 is
      # still entirely Babel 7 (@babel/core ^7.25.2 plus ~29 @babel/* 7.x
      # plugins). Taking @babel/core or @babel/runtime to 8 would create a
      # split-brain toolchain. Revisit when @react-native/babel-preset is
      # Babel 8 capable.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/runtime"
        versions: [">=8.0.0"]
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions (if you have any workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    labels:
      - "dependencies"
      - "github-actions"
